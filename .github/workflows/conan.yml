name: Conan Package

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Conan (GCC 14, ICU=${{ matrix.with_icu }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        with_icu:
          - false
          - true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GCC and Conan
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
          python -m pip install --upgrade pip
          python -m pip install "conan==2.31.1"

      - name: Create and test package
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          conan profile detect --force
          conan create . \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=23 \
            -o "&:with_icu=${{ matrix.with_icu }}"

  windows:
    name: Conan (MSVC, ICU=false)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==2.31.1"

      - name: Create and test package
        shell: powershell
        run: |
          conan profile detect --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          conan create . --build=missing -s build_type=Release -s compiler.cppstd=23 -o "&:with_icu=False"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
